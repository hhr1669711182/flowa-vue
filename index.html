<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flowa</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Hash router: support bare /tms_tracking?num= when the server still serves this index -->
    <script>
      (function () {
        var p = location.pathname || ''
        if (!/\/tms_tracking\/?$/.test(p)) return
        var h = location.hash || ''
        if (h.length > 1 && h.indexOf('tms_tracking') !== -1) return
        var q = location.search || ''
        var prefix = p.replace(/\/?tms_tracking\/?$/, '') || '/'
        if (prefix.slice(-1) !== '/') prefix += '/'
        location.replace(location.origin + prefix + '#/tms_tracking' + q)
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
